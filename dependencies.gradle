dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // JEI API
    api("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // JEI RUNTIME
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Jade mc26.1 26.1.3
    implementation "curse.maven:jade-324717:8251883"

    // KubeJS 8.0.1
    // implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    // compileOnly "curse.maven:kubejs-238086:8219059"
    // interfaceInjectionData("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    // runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    // from howxu maven
    implementation("dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.4-mmcr")

    runtimeOnly "curse.maven:athena-841890:7970442"
    // runtimeOnly "curse.maven:geckolib-388172:8327201"

    // spark
    runtimeOnly "curse.maven:spark-361579:8275631"
    // Oritech
    // runtimeOnly "curse.maven:oritech-1030830:8571095"
    // pipez 1.2.31+26.1.2
    // runtimeOnly "curse.maven:pipez-443900:8351634"

    // 2101.2.7-build.85+Rhino-1.21
    implementation "curse.maven:rhino-416294:8218748"
    // Unit testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.0'

    // implement ae2 api
    runtimeOnly "org.appliedenergistics:appliedenergistics2:26.1.11-SNAPSHOT"
    implementation "org.appliedenergistics:appliedenergistics2:26.1.11-SNAPSHOT:api"

    // 投影
    // runtimeOnly "curse.maven:forgematica-912441:8385300"
    // runtimeOnly "curse.maven:mafglib-910766:8533026"
    // runtimeOnly "maven.modrinth:bsJhdceD:jJ23wJ7U"

    // sodium
    localRuntime "curse.maven:sodium-394468:8396481"

    // mekanism from howxu maven, recently it's unusable
    localRuntime "mekanism:Mekanism:26.1.2-10.8.0.homebaked"
    implementation "mekanism:Mekanism:26.1.2-10.8.0.homebaked:api"

    // guide me
    implementation "curse.maven:guideme-1173950:8204880"

    // patchouli book
    // implementation "curse.maven:patchouli-306770:8404543"
}

dependencies {
    gametestCompileOnly fileTree("${gradle.gradleUserHomeDir}/caches/neoformruntime/intermediate_results") {
        include 'compiledWithNeoForge_*_output.jar'
    }
}
