dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // jei from maven central
    api("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Jade maven central
    implementation "maven.modrinth:jade:${jade_version}"

    // kubejs
    implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    // rhino
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    // ae2 from maven central
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // guide me from maven central
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    // mekanism from howxu maven, recently it's unusable
    runtimeOnly "mekanism:Mekanism:${mekanism_version}"
    implementation "mekanism:Mekanism:${mekanism_version}:api"
    compileOnly "mekanism:Mekanism:${mekanism_version}"

    // ExtendedAE 26.1-1.0.3-neoforge
    implementation "curse.maven:${eae_id}:${eae_version}"
    // ExtendedAE-Plus 1.6.3
    compileOnly "maven.modrinth:${eaep_id}:${eaep_version}"
    localRuntime "maven.modrinth:${eaep_id}:${eaep_version}"
    // glodium 26.1-1.2-neoforge
    implementation "maven.modrinth:${glodium_id}:${glodium_version}"

    // AppliedFlux 26.1-1.0.1-neoforge
    implementation "curse.maven:${aeflux_id}:${aeflux_version}"

    // athena 4.7.3
    compileOnly "curse.maven:${athena_id}:${athena_version}"
    // here's some test need, cause this is a pure client mod
    localRuntime "curse.maven:${athena_id}:${athena_version}"

    // junit
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.0'

    // 1.21.1
    implementation("de.mari_023:${ae2wtlib_id}:${ae2wtlib_version}")
    // applied mek
    implementation "curse.maven:${appliedmek_id}:${appliedmek_version}"
    // ars
    implementation "curse.maven:${ars_id}:${ars_version}"
    runtimeOnly "curse.maven:${geckolib_id}:${geckolib_version}"
    runtimeOnly "curse.maven:${curios_id}:${curios_version}"
    // create
    implementation "curse.maven:${create_id}:${create_version}"
    // Flux Networks 1.21.1-8.0.0
    compileOnly "curse.maven:${fluxnetworks_id}:${fluxnetworks_version}"
    localRuntime "curse.maven:${fluxnetworks_id}:${fluxnetworks_version}"
    // Exact APIs bundled by the existing Create artifact; nested jars are not on javac's classpath.
    compileOnly("com.tterrag.registrate:Registrate:MC1.21-1.3.0+62") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.4") { transitive = false }
    compileOnly("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.56") { transitive = false }
    // Plain JUnit does not unpack Create's nested jars like the NeoForge runtime does.
    testImplementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+62") { transitive = false }
    testImplementation("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.4") { transitive = false }
    testImplementation("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.56") { transitive = false }
}

dependencies {
    // Native Ars relay types expose GeckoLib interfaces during GameTest compilation.
    gametestCompileOnly "curse.maven:${geckolib_id}:${geckolib_version}"
    gametestCompileOnly fileTree("${gradle.gradleUserHomeDir}/caches/neoformruntime/intermediate_results") {
        include 'compiledWithNeoForge_*_output.jar'
    }
}
