configurations {
    clientMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // spark
    clientMods("curse.maven:${spark_id}:${spark_version}")
    // sodium
    clientMods("curse.maven:${sodium_id}:${sodium_version}")
    // athena for ctm
    // clientMods("curse.maven:${athena_id}:${athena_version}")
    // lithium
    clientMods("maven.modrinth:${lithium_id}:${lithium_version}")
    // time in a bottle
    clientMods("maven.modrinth:${tiab_id}:${tiab_version}")
    // modern ui
    clientMods("maven.modrinth:${mui_id}:${mui_version}")
    // JECharacters
    clientMods("curse.maven:${jec_id}:${jec_version}")
    // AE2 x JEI integration
    clientMods("curse.maven:${ae2xjei_id}:${ae2xjei_version}")
    // 可视化性能监测
    clientMods("maven.modrinth:${kotlinFF_id}:${kotlinFF_version}")
    clientMods("maven.modrinth:${ob_id}:${ob_version}")
    clientMods("maven.modrinth:${architectury_id}:${architectury_version}")
    // minimap
    // clientMods("maven.modrinth:${minimap_id}:${minimap_version}")
    // data en
    // why u have such a big number of dependences ?
    // clientMods(files('/home/howxu/Downloads/curios-neoforge-9.5.1+1.21.1.jar'))
    // clientMods(files('/home/howxu/Downloads/ldlib2-neoforge-1.21.1-2.2.42-all.jar'))
    // clientMods(files('/home/howxu/Downloads/data_energistics-1.21.1-3.3.5.jar'))
    // ctm
    // clientMods(files('/home/howxu/Downloads/ctm.jar'))
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll('--username', "howxu")
        runtimeClasspath.from(project.configurations.clientMods)
        
        dependencies{
            // CustomSkinLoader
            // 题外话 我真的是有点讨厌cross platform的mod
            // runtime("curse.maven:${csl_id}:${csl_version}")
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        modSource project.sourceSets.gametest
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // The full suite also needs heap headroom while saving its chunks on shutdown.
        jvmArguments.add('-Xmx6G')
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        arguments.addAll '--existing-mod', 'botania'
    }
}

def prepareGameTestExampleItems = tasks.register('prepareGameTestExampleItems', Copy) {
    from layout.projectDirectory.file('example/startup_scripts/video/Specilized.js')
    into layout.projectDirectory.dir('run/gameTestServer/kubejs/startup_scripts/mmcr_examples')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestExampleItems
}
