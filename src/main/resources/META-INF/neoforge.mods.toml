version="${mod_version}"
displayName="${mod_name}"
logoFile="mmcr.png"
authors="howxu and ModularMachinery-Community-Edition developers"
description='''
Structure previews include adapted LowDragLib2 code under LGPL-3.0-or-later.
See NOTICE and LICENSES/LGPL-3.0.txt.
'''

[[mixins]]
config="mmcr.mixins.json"

[[mixins]]
config="mmcr.jei.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[29.21.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="[26.1.2-8.0.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
