name: Nightly Dev Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          hash="$(git rev-parse --short HEAD)"
          base="$(git tag --merged HEAD --sort=-v:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -z "$base" ]; then
            base="0.0.0"
          fi

          version="${base}+dev-${hash}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Apply CI version
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/m' gradle.properties

      - name: Run Client Data
        run: gradle runClientData --no-daemon

      - name: Run Server Data
        run: gradle runServerData --no-daemon

      - name: Compile Test
        run: gradle compileJava --no-daemon

      - name: Unit Test and GameTest
        run: gradle test --no-daemon

      - name: Gametest Server
        run: gradle runGameTestServer --no-daemon

      - name: Build
        run: gradle build --no-daemon

      - name: Publish to Maven
        run: gradle publish --no-daemon
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Build release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
        run: |
          set -euo pipefail

          current_version="${{ steps.version.outputs.version }}"

          previous_tag="$(
            gh release list --limit 50 --json tagName --jq '.[].tagName' \
              | grep -vFx "$current_version" \
              | head -n1
          )"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          commit_data="$(git log "$range" --pretty=format:'%h %s' --no-merges)"
          fallback="$(bash .github/scripts/format-release-notes.sh \
            "${{ steps.version.outputs.version }}" <<< "$commit_data")"
          full_list="$(bash .github/scripts/format-release-notes.sh --full <<< "$commit_data")"
          if [ -z "$full_list" ]; then
            full_list="- No changes found."
          fi
          changelog="${commit_data:-No changes found.}"

          prompt_template="$(cat .github/prompts/release-notes.md)"
          prompt="$(printf '%s\n\nRelease version: %s\nCommit range: %s\n\nCommits:\n%s' \
            "$prompt_template" "${{ steps.version.outputs.version }}" "$range" "$changelog")"
          generated=""
          if [ -n "${DEEPSEEK_TOKEN:-}" ]; then
            request="$(jq -n --arg model 'deepseek-v4-flash' --arg prompt "$prompt" \
              '{model: $model, messages: [{role: "user", content: $prompt}], temperature: 0.2}')"
            if response="$(curl --fail --silent --show-error --max-time 120 \
              -X POST 'https://api.deepseek.com/chat/completions' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${DEEPSEEK_TOKEN}" \
              --data "$request")"; then
              generated="$(jq -er '.choices[0].message.content' <<< "$response" 2>/dev/null || true)"
            fi
          fi

          if [ -z "$generated" ]; then
            generated="$fallback"
          else
            generated="$(printf '# Release %s\n\n%s\n\n<details>\n<summary>Full commit list</summary>\n\n%s\n\n</details>\n' \
              "${{ steps.version.outputs.version }}" "$generated" "$full_list")"
          fi

          summary="$(printf '%s\n' "$generated" | awk 'index($0, "<details>") { exit } { print }')"

          {
            body_delimiter="release_body_${RANDOM}_${RANDOM}"
            echo "body<<$body_delimiter"
            printf '%s\n' "$generated"
            echo "$body_delimiter"
            summary_delimiter="release_summary_${RANDOM}_${RANDOM}"
            echo "summary<<$summary_delimiter"
            printf '%s\n' "$summary"
            echo "$summary_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release artifacts
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          github-changelog: ${{ steps.notes.outputs.body }}
          modrinth-changelog: ${{ steps.notes.outputs.summary }}
          curseforge-changelog: ${{ steps.notes.outputs.summary }}
          files: build/libs/!(*-@(dev|sources|javadoc|api)).jar
          loaders: neoforge
          environment: client | server
          game-versions: 26.1.2
          java: 25
          modrinth-id: bUctkb7B
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1654570
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
