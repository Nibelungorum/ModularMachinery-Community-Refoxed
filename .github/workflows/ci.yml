name: CI/CD

on:
  push:
    branches:
      - 'neo/**'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nibelungorum/mmcr-ci:1.21.1

    env:
      GRADLE_USER_HOME: /opt/gradle-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restore prewarmed Gradle state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build .gradle
          cp -a /opt/mmcr-seed/build/. build/
          cp -a /opt/mmcr-seed/project-gradle/. .gradle/

      - name: Compile
        run: gradle compileJava

      - name: Run Data
        run: gradle runData

      - name: Unit Test
        run: gradle test

      - name: GameTest
        run: gradle runGameTestServer
