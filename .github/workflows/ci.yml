name: CI/CD

on:
  push:
    branches:
      - 'neo/**'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build properties
        id: properties
        shell: bash
        run: |
          set -euo pipefail

          java_version="$(awk -F= '$1 == "java_version" { print $2; exit }' gradle.properties)"
          if [ -z "$java_version" ]; then
            echo "java_version is missing from gradle.properties" >&2
            exit 1
          fi

          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.properties.outputs.java_version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: gradle compileJava

      - name: Run Data
        run: gradle runData

      - name: Unit Test
        run: gradle test

      - name: GameTest
        run: gradle runGameTestServer
