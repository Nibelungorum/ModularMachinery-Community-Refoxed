name: CI/CD

on:
  push:
    branches:
      - 'neo/**'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nibelungorum/mmcr-ci:26.1.2

    env:
      GRADLE_USER_HOME: /opt/gradle-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restore prewarmed Gradle state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build .gradle
          cp -a /opt/mmcr-seed/build/. build/
          cp -a /opt/mmcr-seed/project-gradle/. .gradle/

      - name: Build and generate data
        run: gradle --no-daemon compileJava runClientData runServerData

      - name: Test
        run: gradle --no-daemon test runGameTestServer
