name: Standard Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          hash="$(git rev-parse --short HEAD)"
          version="${tag}+${hash}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Apply CI version
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/m' gradle.properties

      - name: Run Data Permission
        run: chmod u+x run_data.sh

      - name: Run Data
        run: ./run_data.sh

      - name: Compile Test
        run: gradle compileJava --no-daemon

      - name: Unit Test and GameTest
        run: gradle test --no-daemon

      - name: Gametest Server
        run: gradle runGameTestServer --no-daemon

      - name: Build
        run: gradle build --no-daemon

      - name: Publish to Maven
        run: gradle publish --no-daemon
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Build release notes
        id: notes
        shell: bash
        env:
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
        run: |
          set -euo pipefail

          previous_tag="$(git tag --merged "${{ steps.version.outputs.tag }}^" --sort=-v:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${{ steps.version.outputs.tag }}"
          else
            range="${{ steps.version.outputs.tag }}"
          fi

          commit_data="$(git log "$range" --pretty=format:'%h %s' --no-merges)"
          fallback="$(bash .github/scripts/format-release-notes.sh \
            "${{ steps.version.outputs.version }}" <<< "$commit_data")"
          full_list="$(bash .github/scripts/format-release-notes.sh --full <<< "$commit_data")"
          if [ -z "$full_list" ]; then
            full_list="- No changes found."
          fi
          changelog="${commit_data:-No changes found.}"

          prompt_template="$(cat .github/prompts/release-notes.md)"
          prompt="$(printf '%s\n\nRelease version: %s\nCommit range: %s\n\nCommits:\n%s' \
            "$prompt_template" "${{ steps.version.outputs.version }}" "$range" "$changelog")"
          generated=""
          if [ -n "${DEEPSEEK_TOKEN:-}" ]; then
            request="$(jq -n --arg model 'deepseek-v4-flash' --arg prompt "$prompt" \
              '{model: $model, messages: [{role: "user", content: $prompt}], temperature: 0.2}')"
            if response="$(curl --fail --silent --show-error --max-time 120 \
              -X POST 'https://api.deepseek.com/chat/completions' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${DEEPSEEK_TOKEN}" \
              --data "$request")"; then
              generated="$(jq -er '.choices[0].message.content' <<< "$response" 2>/dev/null || true)"
            fi
          fi

          if [ -z "$generated" ]; then
            generated="$fallback"
          else
            generated="$(printf '# Release %s\n\n%s\n\n<details>\n<summary>Full commit list</summary>\n\n%s\n\n</details>\n' \
              "${{ steps.version.outputs.version }}" "$generated" "$full_list")"
          fi

          {
            delimiter="release_notes_${RANDOM}_${RANDOM}"
            echo "body<<$delimiter"
            printf '%s\n' "$generated"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release artifacts
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog: ${{ steps.notes.outputs.body }}
          files: build/libs/!(*-@(dev|sources|javadoc|api)).jar
          loaders: neoforge
          environment: client | server
          game-versions: 26.1.2
          java: 25
          modrinth-id: bUctkb7B
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1654570
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
